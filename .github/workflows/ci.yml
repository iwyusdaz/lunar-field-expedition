name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Unit tests
        run: npm test
      - name: Build (with test hooks)
        run: npm run build
        env:
          VITE_TEST_HOOKS: '1'
      - name: Functional + a11y tests (overlay)
        run: npx playwright test tests/functional.spec.js tests/a11y.spec.js
      - name: Build (release, no test hooks)
        run: npm run build
      - name: Sub-path test
        run: SLUG=lunar-field-expedition npx playwright test tests/sub-path.spec.js
      - name: Size check
        run: |
          SIZE=$(du -sk dist | cut -f1)
          echo "dist size: ${SIZE} KB"
          BIG=$(find dist -type f -size +20M | head -5)
          if [ -n "$BIG" ]; then echo "Files over 20MB:"; echo "$BIG"; exit 1; fi
      - name: Secret scan
        run: |
          npx -y gitleaks@8.24.3 detect --no-git --redact -v || true
